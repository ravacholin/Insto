name: Android tests

on:
  pull_request:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Create ephemeral debug signing key
        run: >-
          keytool -genkeypair -noprompt -keystore debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -dname 'CN=Android Debug,O=Android,C=US'
          -keyalg RSA -keysize 2048 -validity 10000
      - name: Run Android unit tests and build debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
