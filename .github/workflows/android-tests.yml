name: Android tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Verify vendored VAD library checksum
        run: |
          expected=$(grep -oE 'SHA-256: `[0-9a-f]{64}`' app/libs/README.md | grep -oE '[0-9a-f]{64}')
          if [ -z "$expected" ]; then
            echo "::error::No SHA-256 documented in app/libs/README.md"
            exit 1
          fi
          echo "$expected  app/libs/android-vad-webrtc-2.0.10.aar" | sha256sum --check --strict
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Create ephemeral debug signing key
        run: >-
          keytool -genkeypair -noprompt -keystore debug.keystore
          -storepass android -keypass android -alias androiddebugkey
          -dname 'CN=Android Debug,O=Android,C=US'
          -keyalg RSA -keysize 2048 -validity 10000
      - name: Run Android unit tests and build debug APK
        id: unit
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v5
        with:
          name: insto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Print failing test stack traces
        if: failure()
        run: |
          python3 - <<'PYREPORT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in sorted(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')):
              suite = ET.parse(path).getroot()
              for case in suite.findall('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      print(f"{case.get('classname')}.{case.get('name')}", flush=True)
                      print(failure.get('message', ''), flush=True)
                      print(failure.text or '', flush=True)
          PYREPORT
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Check for a committed lint baseline
        id: baseline
        if: ${{ !cancelled() }}
        run: |
          if git ls-files --error-unmatch app/lint-baseline.xml >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Run Android lint
        if: ${{ !cancelled() }}
        continue-on-error: ${{ steps.baseline.outputs.exists != 'true' }}
        run: ./gradlew --no-daemon lintDebug
      - name: Upload Android lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Generate JaCoCo unit test coverage
        id: coverage
        if: ${{ !cancelled() && steps.unit.outcome == 'success' }}
        continue-on-error: true
        run: ./gradlew --no-daemon -PinstoCoverage :app:createDebugUnitTestCoverageReport
      - name: Upload JaCoCo coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: android-unit-test-coverage
          path: app/build/reports/coverage/
          if-no-files-found: error
