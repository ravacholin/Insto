name: Android release sin firmar

on:
  workflow_dispatch:
  push:
    branches: [build/omniremote-apk]

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/build/omniremote-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Compilar y verificar APK sin firma
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          badging=$("$tools_dir/aapt" dump badging "$apk")
          grep -E "^package: name='com[.]aistudio[.]pingassist[.]qvrtkm' " <<< "$badging"
          if "$tools_dir/apksigner" verify "$apk" > unsigned-check.log 2>&1; then
            echo "::error::Se esperaba una APK sin firma."
            exit 1
          fi
          cat unsigned-check.log
          grep -F 'Missing META-INF/MANIFEST.MF' unsigned-check.log
          sha256sum "$apk"
          if (( $(stat -c '%s' "$apk") > 30000000 )); then
            split -b 30000000 -d "$apk" unsigned-apk-part-
          fi
      - name: Guardar APK sin firma
        uses: actions/upload-artifact@v5
        with:
          name: insto-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Guardar primera parte si es grande
        if: ${{ hashFiles('unsigned-apk-part-00') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: insto-release-unsigned-part-00
          path: unsigned-apk-part-00
      - name: Guardar segunda parte si es grande
        if: ${{ hashFiles('unsigned-apk-part-01') != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: insto-release-unsigned-part-01
          path: unsigned-apk-part-01
