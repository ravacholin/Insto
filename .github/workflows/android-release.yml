name: Android release sin firmar

on:
  workflow_dispatch:
  push:
    branches: [build/omniremote-apk]

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/build/omniremote-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Compilar y verificar APK sin firma
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          test "$("$tools_dir/aapt" dump packagename "$apk")" = com.aistudio.pingassist.qvrtkm
          if "$tools_dir/apksigner" verify "$apk" > unsigned-check.log 2>&1; then
            echo "::error::Se esperaba una APK sin firma."
            exit 1
          fi
          cat unsigned-check.log
          grep -F 'Missing META-INF/MANIFEST.MF' unsigned-check.log
      - name: Guardar APK sin firma
        uses: actions/upload-artifact@v5
        with:
          name: insto-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
